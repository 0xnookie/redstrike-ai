name: recall-benchmark

# Phase 2: run a real Redstrike engagement against OWASP Juice Shop, then score recall and gate on
# regressions. Manual (workflow_dispatch) to control cost — each run spends model budget. The committed
# baseline is an ASSISTED ceiling (40/116); the FIRST autonomous CI run should use mode=baseline to record
# the true autonomous floor, after which mode=check gates future runs.
#
# Needs a repo secret: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN). Without it, the engagement run and
# the gate are skipped and the job only validates the benchmark tooling.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (gate vs baseline) or baseline (record a new floor)"
        type: choice
        options: ["check", "baseline"]
        default: "check"
      max_turns:
        description: "autonomous turn cap"
        default: "300"
      max_budget_usd:
        description: "autonomous USD budget cap"
        default: "15"
      tolerance:
        description: "allowed recall drop before it's a regression (absorbs LLM variance)"
        default: "0.05"
  # Uncomment to run weekly on the default branch (uses repo secrets). Costs model budget each run.
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  juice-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports: ["3000:3000"]
    env:
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate benchmark tooling (no network)
        run: python scripts/benchmark.py --selftest

      - name: Wait for Juice Shop
        run: timeout 180 bash -c 'until curl -sf "$BASE_URL/rest/admin/application-version"; do sleep 3; done'

      - name: Detect credentials
        id: creds
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ] || [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN secret — skipping the engagement run and the gate."
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Install the Redstrike CLI + Claude Code engine
        if: steps.creds.outputs.have == 'yes'
        run: |
          pip install ./cli
          npm install -g @anthropic-ai/claude-code
          redstrike --no-banner --no-color doctor --env || true

      - name: Run the Redstrike engagement (autonomous, headless, benign-PoC, scoped to Juice Shop)
        if: steps.creds.outputs.have == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -eu
          redstrike --no-banner --no-color init "juice-shop-ci" \
            --url "$BASE_URL" \
            --authorized-by "CI recall benchmark — OWASP Juice Shop deliberately-vulnerable training target" \
            --notes "Automated recall benchmark; disposable CI instance; benign in-app exploitation pre-approved." \
            --i-confirm-authorization --force
          ENG="$(basename "$(ls -d engagements/juice-shop-ci-* | head -1)")"
          echo "ENG=$ENG" >> "$GITHUB_ENV"
          # Pre-approve BENIGN in-app exploitation for the benchmark (the same "autonomous benign PoCs"
          # choice a human makes): drop `exploitation` from approval_required_phases, leaving host-level
          # post-exploitation gated. WITHOUT this the autonomous run does recon only and scores ~0.
          sed -i '/^    - exploitation$/d' "engagements/$ENG/scope.yaml"
          # Autonomous, deny-by-default + scope gate; pre-allow Bash so shell steps don't defer (no human in
          # CI). The OS sandbox + scope gate still confine actions to the in-scope localhost target.
          redstrike --no-banner --no-color run "$ENG" --autonomous \
            --allow Bash \
            --prompt "Run a full web penetration test against ${BASE_URL} (OWASP Juice Shop). Benign in-app exploitation PoCs are PRE-APPROVED: prove each vulnerability with a benign PoC to maximize coverage across the OWASP Top 10 + API + web classes. Work recon -> every applicable vuln category (plan the deterministic coverage ledger with scripts/coverage.py, then run each) -> chaining, autonomously. Pause only for host-level post-exploitation. Do not stop early." \
            --max-turns "${{ inputs.max_turns }}" \
            --max-budget-usd "${{ inputs.max_budget_usd }}" \
          || echo "::warning::engagement run exited non-zero (budget/turn cap or deferral) — scoring whatever it achieved"

      - name: Capture the answer key
        run: curl -sf "$BASE_URL/api/Challenges" -o challenges.json && echo "captured $(wc -c < challenges.json) bytes"

      - name: Score recall
        run: python scripts/benchmark.py --score --target juice-shop --answer-key challenges.json

      - name: Record a new baseline (mode=baseline)
        if: steps.creds.outputs.have == 'yes' && inputs.mode == 'baseline'
        run: |
          python scripts/benchmark.py --baseline --target juice-shop --answer-key challenges.json \
            --provenance "autonomous CI run ${{ github.run_id }} on ${{ github.sha }}"
          echo "::notice::New baseline recorded — download the artifact and commit benchmark/baselines/juice-shop.json."

      - name: Upload the recorded baseline
        if: steps.creds.outputs.have == 'yes' && inputs.mode == 'baseline'
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-baseline
          path: benchmark/baselines/juice-shop.json

      - name: Regression check vs baseline (mode=check, gates the job)
        if: steps.creds.outputs.have == 'yes' && inputs.mode == 'check'
        run: python scripts/benchmark.py --check --target juice-shop --answer-key challenges.json --tolerance "${{ inputs.tolerance }}"
