name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate framework (skills, manifests, schemas, agent/skill frontmatter)
        run: python scripts/validate.py
      - name: Spot-check a manifest wires (reflected XSS vs empty dir => exit 2)
        run: |
          mkdir -p /tmp/empty
          python skills/_contract/verify_completion.py --skill skills/xss-reflected --out /tmp/empty || test $? -eq 2
      - name: Framework script unit tests (verify_completion + console; stdlib)
        run: |
          for t in skills/_contract/tests/test_*.py scripts/tests/test_*.py; do
            echo "· $t"; python "$t" || exit 1
          done

  cli:
    # The launcher targets Windows/WSL + Linux, so exercise the stdlib CLI on both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        # Use bash on every OS (Git Bash ships on the GitHub Windows runners) so the
        # shell steps below are portable without a second PowerShell transcription.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyYAML (exercises the PyYAML path; the CLI itself is stdlib-only)
        run: pip install "PyYAML>=6"
      - name: redstrike CLI unit tests (stdlib)
        run: for t in cli/tests/test_*.py; do python "$t"; done
      - name: Packaging + console script
        run: |
          pip install ./cli
          redstrike --no-banner --no-color version
      - name: Dry-run smoke (scaffold + build argv; no engine)
        env:
          REDSTRIKE_REPO: ${{ github.workspace }}
        run: |
          redstrike --no-banner --no-color init "CI Test" --authorized-by "ci / auth-ref" \
            --domain '*.ci.test' --i-confirm-authorization
          redstrike --no-banner --no-color run "ci-test-$(date -u +%F)" --dry-run
      - name: Framework validate + scripts/tests unit suite (stdlib; cross-platform)
        # validate.py + the scripts/tests/* suite are stdlib-only, so exercise them across the same
        # os × python matrix as the CLI (the `validate` job above runs them on ubuntu/3.11 only).
        run: |
          python scripts/validate.py
          for t in scripts/tests/test_*.py; do echo "· $t"; python "$t" || exit 1; done

  console:
    # Type + lint gate for the web console (TypeScript/Next.js).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install deps (enforces the lockfile)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
