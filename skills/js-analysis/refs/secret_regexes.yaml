# Secret detection patterns for the jsluice/grep pass (step 9).
# trufflehog & gitleaks carry their own detector sets; this corpus is the
# custom/known layer. Expand per-engagement. Entropy fallback handles the rest.
#
# schema: list of { id, description, regex, entropy? }

patterns:
  - id: aws-access-key-id
    description: AWS Access Key ID
    regex: '\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b'
  - id: aws-secret-access-key
    description: AWS Secret Access Key (contextual — pair with akid/entropy)
    regex: '(?i)aws(.{0,20})?(secret|private).{0,20}[=:]\s*["'']?[A-Za-z0-9/+]{40}'
  - id: google-api-key
    description: Google API key
    regex: '\bAIza[0-9A-Za-z\-_]{35}\b'
  - id: slack-token
    description: Slack token
    regex: '\bxox[baprs]-[0-9A-Za-z-]{10,72}\b'
  - id: github-pat
    description: GitHub personal access / fine-grained token
    regex: '\b(ghp|gho|ghu|ghs|ghr|github_pat)_[0-9A-Za-z_]{20,255}\b'
  - id: stripe-secret
    description: Stripe secret/live key
    regex: '\b(sk|rk)_(live|test)_[0-9A-Za-z]{10,99}\b'
  - id: jwt
    description: JSON Web Token
    regex: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
  - id: private-key-block
    description: PEM private key header
    regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
  - id: bearer-authorization
    description: Hardcoded bearer/Authorization header
    regex: '(?i)authorization["'']?\s*[:=]\s*["'']?bearer\s+[A-Za-z0-9._\-]{10,}'
  - id: generic-assigned-secret
    description: key/secret/token/password assigned a long literal
    regex: '(?i)\b(api[_-]?key|secret|token|passwd|password|client[_-]?secret)\b["'']?\s*[:=]\s*["''][^"'']{12,}["'']'

# high-entropy fallback for anything the known patterns miss
entropy:
  min_shannon_bits: 3.5   # per-char; ~base64 noise
  min_len: 20
  charsets: [base64, hex]
