[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redstrike-cli"
version = "0.1.0"
description = "Redstrike launcher — runs Claude Code as the engagement engine, scoped and gated."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "same-as-repo" }
# Stdlib-only by design (matches scripts/validate.py, cvss.py, verify_completion.py).
# PyYAML is used when present and falls back to a bundled reader otherwise.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
rich = ["rich>=13"]
dev = ["PyYAML>=6", "ruff>=0.5"]

[project.scripts]
redstrike = "redstrike_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["redstrike_cli*"]

[tool.ruff]
line-length = 100
target-version = "py310"
